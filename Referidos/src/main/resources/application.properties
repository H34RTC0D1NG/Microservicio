spring.application.name = Referidos

server.port = 8084

spring.datasource.url = jdbc:mysql://localhost:3306/Referidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username = root
spring.datasource.password =

spring.jpa.hibernate.ddl-auto = none

spring.flyway.enabled = true
spring.flyway.locations = classpath:DB/Migracion

spring.jpa.show-sql = true
spring.jpa.open-in-view = false

server.error.include-message = always

springdoc.swagger-ui.path = /swagger-ui.html
